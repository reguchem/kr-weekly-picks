name: backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 2 1,4,7,10 *"   # 분기마다(1·4·7·10월 2일 10:17 KST) 재검증

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 백테스트 실행 및 전략 선택
        timeout-minutes: 150
        env:
          TZ: Asia/Seoul
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m src.backtest
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          git diff --cached --quiet || git commit -m "data: backtest $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase -X theirs && git push
