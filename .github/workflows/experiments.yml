name: experiments

on:
  workflow_dispatch:
    inputs:
      markets:
        description: "후보 시장 (예: KOSPI 또는 KOSPI,KOSDAQ). 비우면 기본값"
        type: string
        default: ""
      size:
        description: "시가총액 상위 N. 비우면 기본값"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 개선안 비교 실험
        timeout-minutes: 150
        env:
          TZ: Asia/Seoul
          UNIVERSE_MARKETS: ${{ inputs.markets }}
          UNIVERSE_SIZE: ${{ inputs.size }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m src.experiments | tee experiments.log
      - name: 결과 커밋
        if: always()
        run: |
          mkdir -p docs/data && cp experiments.log docs/data/experiments.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          git diff --cached --quiet || git commit -m "data: experiments $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git pull --rebase && git push
