name: weekly

on:
  schedule:
    - cron: "50 22 * * 1"    # 화요일 07:50 KST — 월요일 종가 기준 추천 (화 09:00 시가 매매)
    - cron: "50 7 * * 1-5"   # 평일 16:50 KST — 매일 보유 종목 점검·성과 갱신, 목요일은 목 종가 기준 추천 (금 09:00 시가 매매)
  workflow_dispatch:
    inputs:
      slot:
        description: "수동 추천: tue(월 종가 기준) / thu(목 종가 기준) / 비우면 점검·성과만"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 추천 · 점검 · 성과 갱신
        env:
          SLOT: ${{ inputs.slot }}
          TZ: Asia/Seoul
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m src.weekly
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push
