name: weekly

on:
  schedule:
    - cron: "50 22 * * 1"    # 화요일 07:50 KST — 월요일 종가 기준 추천 (화 09:00 시가 매매)
    - cron: "50 6 * * 1-5"   # 평일 15:50 KST (16:00 전후 반영) — 매일 보유 종목 점검·성과 갱신, 목요일은 목 종가 기준 추천 (금 09:00 시가 매매)
  workflow_dispatch:
    inputs:
      slot:
        description: "수동 추천: tue(월 종가 기준) / thu(목 종가 기준) / 비우면 점검·성과만"
        type: string
        default: ""
      force:
        description: "같은 회차 추천을 다시 계산 (1이면 기존 회차 덮어쓰기)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 추천 · 점검 · 성과 갱신
        env:
          SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
          TZ: Asia/Seoul
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          FLOW_SOURCE: naver          # 수급은 네이버만 사용 (KRX 종목별 순차 조회는 15~25분 걸려 제외)
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/data
          python -m src.weekly 2>&1 | while IFS= read -r l; do printf '[%s] %s\n' "$(date +%H:%M:%S)" "$l"; done | tee docs/data/run_log.txt
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs && git push
