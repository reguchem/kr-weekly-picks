name: weekly

on:
  schedule:
    - cron: "33 6 * * 1-5"   # 평일 15:33 KST (UTC 06:33) — 화요일 추천, 매일 보유 종목 점검·성과 갱신
  workflow_dispatch:
    inputs:
      force:
        description: "요일과 무관하게 이번 주 추천 생성 (이번 주 추천이 없을 때만)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 추천 · 점검 · 성과 갱신
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
          TZ: Asia/Seoul
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m src.weekly
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cache
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push
