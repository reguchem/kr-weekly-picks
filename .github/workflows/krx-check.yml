name: krx-check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: KRX 진단
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python -m tests.krx_debug 2>&1 | grep -v -i "pw\|password" | tee krx_check.txt
      - name: 결과 커밋
        run: |
          mkdir -p docs/data && mv krx_check.txt docs/data/krx_check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/krx_check.txt
          git diff --cached --quiet || git commit -m "data: krx check"
          git pull --rebase && git push
